name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-render.txt
      # The tests need only the runtime packages; the pickle-parity test skips itself without scikit-learn.
      - run: pip install -r requirements-render.txt pytest
      - run: python -m pytest
